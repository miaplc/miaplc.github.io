<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-label="Cantiere: lavori in corso" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="st" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="22" fill="#facc15"/><rect x="11" width="11" height="22" fill="#111827"/>
    </pattern>
    <pattern id="st2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="7" height="14" fill="#f97316"/><rect x="7" width="7" height="14" fill="#f8fafc"/>
    </pattern>
  </defs>
  <!-- terreno -->
  <rect x="0" y="150" width="320" height="4" rx="2" fill="#334155"/>
  <!-- gru -->
  <g stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M250 150 V22 M262 150 V22 M250 22 H262"/>
    <path d="M250 40 L262 58 M262 40 L250 58 M250 76 L262 94 M262 76 L250 94 M250 112 L262 130 M262 112 L250 130"/>
    <path d="M180 22 H300 M180 22 L250 8 L262 8 L300 22"/>
  </g>
  <rect x="286" y="24" width="16" height="12" rx="2" fill="#475569"/>
  <path d="M196 23 V70" stroke="#94a3b8" stroke-width="2"/>
  <!-- blocco appeso: un PLC in costruzione -->
  <g transform="translate(180 70)">
    <rect width="32" height="24" rx="3" fill="#0e7490" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="8" cy="8" r="2.5" fill="#22c55e"/><circle cx="16" cy="8" r="2.5" fill="#facc15"/><circle cx="24" cy="8" r="2.5" fill="#ef4444"/>
    <rect x="6" y="15" width="20" height="4" rx="1" fill="#22d3ee" opacity=".6"/>
  </g>
  <!-- transenna -->
  <g>
    <rect x="22" y="78" width="10" height="72" fill="#64748b"/><rect x="152" y="78" width="10" height="72" fill="#64748b"/>
    <rect x="14" y="142" width="26" height="8" rx="2" fill="#475569"/><rect x="144" y="142" width="26" height="8" rx="2" fill="#475569"/>
    <rect x="10" y="84" width="164" height="26" rx="3" fill="url(#st)" stroke="#111827" stroke-width="2"/>
    <rect x="10" y="118" width="164" height="14" rx="3" fill="url(#st)" stroke="#111827" stroke-width="2"/>
    <!-- lampeggianti -->
    <rect x="23" y="70" width="8" height="8" fill="#334155"/><circle cx="27" cy="64" r="8" fill="#f97316"/><circle cx="27" cy="64" r="14" fill="#f97316" opacity=".2"/>
    <rect x="153" y="70" width="8" height="8" fill="#334155"/><circle cx="157" cy="64" r="8" fill="#f97316"/><circle cx="157" cy="64" r="14" fill="#f97316" opacity=".2"/>
  </g>
  <!-- cono -->
  <g transform="translate(204 104)">
    <path d="M16 0 L30 44 H2 Z" fill="url(#st2)" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-4" y="42" width="40" height="6" rx="2" fill="#c2410c"/>
  </g>
</svg>
